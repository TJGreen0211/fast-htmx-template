<div class="container d-flex align-items-center justify-content-center min-vh-100">
  <div class="card shadow-sm p-4 w-100" style="max-width: 500px;">
    <h3 class="mb-4 text-center">Sign In</h3>
    <form id="loginForm" hx-post="/login">
      <div class="mb-3">
        <label for="userLoginEmailInput" class="form-label">Email address</label>
        <input type="email" class="form-control" id="userLoginEmailInput" name="username"
          placeholder="info@email.com" required autocomplete="username" />
      </div>
      <div class="mb-3">
        <label for="userLoginPasswordInput" class="form-label">Password</label>
        <input type="password" class="form-control" id="userLoginPasswordInput" name="password"
          placeholder="••••••••••••" required autocomplete="current-password" />
      </div>
      <div class="mb-3 form-check">
        <input class="form-check-input" type="checkbox" id="userLoginRememberMeCheckbox" name="remember" />
        <label class="form-check-label" for="userLoginRememberMeCheckbox">Remember me</label>
      </div>
      <button type="submit" class="btn btn-primary w-100">Sign in</button>
    </form>
  </div>
</div>
