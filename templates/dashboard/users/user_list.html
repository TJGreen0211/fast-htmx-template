<table class="table">
  <thead>
    <tr>
      <th scope="col">Email</th>
      <th scope="col">First</th>
      <th scope="col">Last</th>
      <th scope="col">Permissions</th>
      <th scope="col">Registered</th>
      <th scope="col"></th>
    </tr>
  </thead>
  <tbody>
    {% for user in users %}
    <tr>
      <th>{{ user.username }}</th>
      <td>{{ user.first_name }}</td>
      <td>{{ user.last_name }}</td>
      <td><select class="form-control" name="calendarMonth">
          <option>Admin</option>
          <option>User</option>
          <option>Etc</option>
        </select></td>
      <td>{{ user.registered }}</td>
      <td>
        <button type="button" class="btn btn-danger" hx-delete="/user/{{ user.id }}" hx-swap="outerHTML"
          hx-confirm="Remove user {{ user.username }}?" hx-target="closest tr">
          Remove
        </button>
      </td>
    </tr>
    {% endfor %}
  </tbody>
</table>
