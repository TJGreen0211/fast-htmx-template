<div id="add-user-form">
  <h1>Admin User Management</h1>
  <hr />
  <section>
    <h2>Add Admin User</h2>
    <form id="userAddForm" hx-post="/add-user" hx-target="#addUserFeedback" hx-swap="innerHTML" hx-trigger="submit" hx-on::after-request="if(event.detail.successful) { htmx.ajax('GET', '/dashboard/users/list', {target: '#userManagementList', swap: 'innerHTML'}); }">
      <div class="form-group">
        <label for="addUserEmail" class="form-label">Email:</label>
        <input type="email" class="form-control" id="addUserEmail" aria-describedby="emailHelp" name="username"
          placeholder="admin@email.com" required />
      </div>
      <div class="form-row">
        <div class="col">
          <input type="text" class="form-control" id="addUserFirstName" placeholder="First Name" name="first_name" required />
        </div>
        <div class="col">
          <input type="text" class="form-control" id="addUserLastName" placeholder="Last Name" name="last_name" required />
        </div>
      </div>
      <div class="form-group">
        <label for="addUserPassword" class="form-label">Password:</label>
        <input type="password" class="form-control" id="addUserPassword" name="password"
          placeholder="••••••••••••" required />
      </div>
      <br />
      <button type="submit" class="btn btn-primary">Add User</button>
    </form>
    <div id="addUserFeedback"></div>
  </section>
  <section>
    <hr />
    <h2>Manage Users</h2>
    <div hx-get="/dashboard/users/list" hx-trigger="load, reloadUserList from:body" hx-swap="innerHTML" hx-target="#userManagementList">
      <div id="userManagementList"></div>
    </div>
  </section>
</div>
