<!-- templates/index.html -->
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>tjgreen</title>
  <script src="/static/js/htmx.min.js"></script>
  <script src="/static/js/popper.min.js"></script>
  <script src="/static/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="/static/css/bootstrap.css" />
  <style>
    .btn {
      background-color: #3C506E;
      color: #fff;
      transition: all 0.7s;
      border-color: #01a09f;
    }

    .btn:hover {
      color: #fff;
      background-color: #01a09f;
      border-color: #3C506E;
    }

    a {
      cursor: pointer;
    }

    .navbar-custom {
      background-color: #3C506E;
    }

    #app {
      font-family: Avenir, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      color: #2c3e50;
    }

    .main {
      padding-top: 2em;
    }
  </style>
</head>

<body>
  <header>
    <nav class="navbar navbar-expand-md navbar-dark navbar-custom">
      <div class="container">
        <a class="navbar-brand" href="/">tjgreen.io</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse"
          aria-controls="navbarCollapse" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarCollapse">
         <ul id="navbarLinks" class="navbar-nav me-auto mb-2 mb-md-0" hx-get="/user/navbar" hx-trigger="load, refreshNavbar from:body" hx-swap="innerHTML">
            {% block navbar_items %}{% endblock %}
          </ul>
        </div>
      </div>
    </nav>
  </header>
  <main>
    <div id="app" class="main container">
      <div id="mainContent">
        {% block main_content %}{% endblock %}
      </div>
    </div>
  </main>
  <footer class="bg-white text-center py-3 shadow-sm mt-auto">
    <div class="container">
      <span class="text-muted">&copy; 2026 TJ Green. All rights reserved.</span>
    </div>
  </footer>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var mc = document.getElementById('mainContent');
      if (!mc || !mc.innerHTML.trim()) {
        htmx.ajax('GET', '/user/whoami', {target: '#mainContent', swap: 'innerHTML'});
      }
    });
  </script>
</body>

</html>
