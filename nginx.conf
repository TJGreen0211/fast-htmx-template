server {
    listen       80;
    listen       [::]:80;
    server_name  byjessieann.com;
    return 301   https://$server_name$request_uri;
}

server {
    listen       443 ssl http2;
    listen       [::]:443 ssl http2;
    server_name  byjessieann.com;

    ssl_certificate /etc/letsencrypt/live/byjessieann.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/byjessieann.com/privkey.pem;
    location / {
        root /home/ubuntu/deploy/client/dist;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    error_page 500 502 503 504 /50x.html;

    error_log  /var/log/nginx/vibe-app-error.log;
    access_log /var/log/nginx/vibe-app-access.log;
}

server {
   listen       443 ssl http2;
   listen       [::]:443 ssl http2;
   server_name  byjessieann.com;

   ssl_certificate /etc/letsencrypt/live/byjessieann.com/fullchain.pem;
   ssl_certificate_key /etc/letsencrypt/live/byjessieann.com/privkey.pem;

   location / {
       proxy_pass https://127.0.0.1:5000;
   }

   error_page 500 502 503 504 /50x.html;

   error_log  /var/log/nginx/vibe-app-error.log;
   access_log /var/log/nginx/vibe-app-access.log;
}
